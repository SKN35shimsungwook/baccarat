<div class="bt-root cr">
  <section class="cr-stage" data-el="stage">
    <canvas class="cr-canvas" data-el="canvas"></canvas>
    <header class="bt-top cr-top">
      <div class="bt-kv"><span>보유 칩</span><b data-el="balance">0</b></div>
      <div class="bt-kv"><span>손익</span><b data-el="profit">0</b></div>
      <div class="bt-kv right"><span>총 베팅</span><b data-el="totalbet">0</b></div>
    </header>
    <div class="cr-recent" data-el="recent"></div>
    <div class="cr-mult" data-el="mult">1.00x</div>
    <div class="cr-msg" data-el="msg"></div>
    <div class="cr-fair" data-el="fair"></div>
  </section>

  <section class="bt-controls cr-controls">
    <div class="cr-panel" data-panel="1"></div>
    <button class="cr-takeoff" data-el="takeoff">이륙 <kbd>Space</kbd></button>
    <div class="cr-panel" data-panel="2"></div>
  </section>
  <div class="bt-toast" data-el="toast"></div>
</div>
